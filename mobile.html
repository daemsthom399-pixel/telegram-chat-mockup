<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>Telegram Mockup Mobile V6.5.1</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",Arial,sans-serif;background:#d8d8d8}.app{height:100dvh;max-width:520px;margin:auto;display:flex;flex-direction:column;position:relative;overflow:hidden}.app:before{content:"";position:absolute;inset:0;background:url('assets/chat-bg.png') center/cover no-repeat}.header{z-index:3;min-height:64px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;background:rgba(223,243,242,.9);backdrop-filter:blur(16px)}.back{font-size:32px;width:28px}.avatar{width:40px;height:40px;border-radius:50%;overflow:hidden;background:#79aee8;display:grid;place-items:center;color:#fff;font-weight:700}.avatar img{width:100%;height:100%;object-fit:cover}.info{flex:1;min-width:0;margin-left:10px}.name{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:12px;color:#687c86}.actions{font-size:20px;color:#4e6674}.mock{position:absolute;z-index:8;right:10px;top:calc(72px + env(safe-area-inset-top));font-size:9px;color:#526f7b;background:#ffffffc9;padding:3px 7px;border-radius:10px}.messages{z-index:1;flex:1;overflow:auto;padding:14px 10px 8px;display:flex;flex-direction:column;gap:6px;scrollbar-width:none}.messages::-webkit-scrollbar{display:none}.msg{max-width:84%;min-width:58px;padding:7px 10px 6px;border-radius:17px;font-size:16px;line-height:1.3;box-shadow:0 1px 1px #0001;white-space:pre-wrap;word-break:break-word}.them{align-self:flex-start;background:#fff;border-bottom-left-radius:5px}.me{align-self:flex-end;background:#eefcf7;border-bottom-right-radius:5px}.meta{font-size:10px;color:#7a8a90;margin-left:7px;white-space:nowrap;float:right;margin-top:7px}.checks{color:#3d9ac4}.replyBox{border-left:3px solid #53a7ea;background:#53a7ea18;padding:5px 7px;border-radius:8px;margin-bottom:5px}.replyName{font-weight:700;color:#3786c5;font-size:12px}.replyText{color:#4d5e68;font-size:12px}.msg.media{padding:5px}.msg.media img{display:block;max-width:72vw;max-height:42vh;border-radius:12px}.caption{padding:6px 5px 2px}.composerOuter{z-index:3;padding:0 8px calc(8px + env(safe-area-inset-bottom))}.replyDraft{display:none;background:#f8fcfcf7;padding:8px 11px;border-radius:16px 16px 8px 8px;margin-bottom:3px;align-items:center}.replyDraft.show{display:flex}.replyContent{flex:1;min-width:0}.replyTitle{font-size:12px;color:#3786c5;font-weight:700}.replyPreview{font-size:12px;color:#5b6d77;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.close{border:0;background:transparent;font-size:20px}.composerRow{display:flex;gap:7px;align-items:flex-end}.composer{flex:1;min-height:44px;background:#f8fcfcf7;border-radius:23px;padding:8px 11px;display:flex;align-items:center;gap:7px}.composer input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px}.icon{border:0;background:transparent;font-size:20px;padding:0}.send{width:44px;height:44px;border-radius:50%;border:0;background:#3390ec;color:#fff;font-size:19px}.settingsBtn{position:absolute;z-index:9;right:12px;bottom:calc(70px + env(safe-area-inset-bottom));width:44px;height:44px;border:0;border-radius:50%;background:#3390ec;color:#fff;font-size:20px;box-shadow:0 2px 8px #0003}.backdrop{display:none;position:absolute;z-index:19;inset:0;background:#0004}.backdrop.show{display:block}.sheet{position:absolute;z-index:20;left:0;right:0;bottom:0;max-height:82dvh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:.2s}.sheet.show{transform:translateY(0)}.handle{width:42px;height:5px;border-radius:5px;background:#d3d7da;margin:0 auto 12px}.sheet h2{font-size:18px;margin:0 0 12px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:#65727b;margin-bottom:5px}.field input,.field select,.field button{width:100%;padding:11px;border:1px solid #d4dce1;border-radius:10px;background:#fff;font-size:16px}.row{display:flex;gap:8px}.row>*{flex:1}.users{display:flex;gap:7px;overflow:auto;padding:3px 0 7px}.user{flex:none;border:1px solid #dce4ea;border-radius:10px;padding:8px;background:#f8fafc}.user.active{border-color:#3390ec;background:#edf6ff}.primary{background:#3390ec!important;color:#fff!important}.danger{color:#a43d3d!important;background:#fff5f5!important}.senderState{text-align:center;font-size:12px;color:#60727d}.hint{font-size:11px;color:#718089;line-height:1.5;margin-top:10px}</style></head><body><main class="app"><div class="mock">MOCKUP · 模拟聊天</div><header class="header"><div class="back">‹</div><div class="avatar" id="avatar"></div><div class="info"><div class="name" id="name"></div><div class="status" id="status"></div></div><div class="actions">⌕　⋮</div></header><section class="messages" id="messages"></section><div class="composerOuter"><div class="replyDraft" id="replyDraft"><div class="replyContent"><div class="replyTitle" id="replyTitle"></div><div class="replyPreview" id="replyPreview"></div></div><button class="close" id="closeReply">×</button></div><div class="composerRow"><div class="composer"><button class="icon" id="clipBtn">📎</button><input id="messageInput" placeholder="输入信息" autocomplete="off"><button class="icon">😊</button></div><button class="send" id="sendBtn">➤</button></div></div><button class="settingsBtn" id="settingsBtn">⚙</button><div class="backdrop" id="backdrop"></div><section class="sheet" id="sheet"><div class="handle"></div><h2>手机设置 · V6.5.1</h2><div class="users" id="userList"></div><div class="row"><div class="field"><button id="addUser" class="primary">添加用户</button></div><div class="field"><button id="deleteUser" class="danger">删除当前用户</button></div></div><div class="field"><label>昵称</label><input id="nameInput"></div><div class="field"><label>状态</label><input id="statusInput"></div><div class="field"><label>头像</label><input id="avatarInput" type="file" accept="image/*"></div><div class="field"><button id="saveUser" class="primary">保存当前用户</button></div><div class="row"><div class="field"><label>聊天当前时间</label><input id="timeInput" type="time"></div><div class="field"><label>我的消息状态</label><select id="readInput"><option value="✓✓">✓✓ 已读</option><option value="✓">✓ 已发送</option></select></div></div><div class="senderState" id="senderState"></div><div class="row"><div class="field"><button id="switchSender">切换发送方</button></div><div class="field"><button id="clearChat" class="danger">清空聊天</button></div></div><div class="hint">输入框为空时点发送键可切换发送方；单击消息引用；长按消息删除。时间自动递增 0–3 分钟。MOCKUP 标识始终保留。</div></section><input id="imageInput" type="file" accept="image/*" hidden></main><script>const KEY='tgMockupV62',ME='星巴克搭建',G=id=>document.getElementById(id),now=()=>new Date().toTimeString().slice(0,5);let saved=null;try{saved=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}let users=(saved&&saved.users&&saved.users.length)?saved.users:[{id:1,name:'聊天用户',status:'最近在线',avatar:'',messages:[]}];let currentUserId=(saved&&users.some(x=>x.id===saved.currentUserId))?saved.currentUserId:users[0].id;let sender='them',reply=null,pendingAvatar='',longTimer=null;G('timeInput').value=now();function cur(){return users.find(x=>x.id===currentUserId)||users[0]}function save(){try{localStorage.setItem(KEY,JSON.stringify({users:users,currentUserId:currentUserId}))}catch(e){alert('本地保存空间不足，请减少图片数量')}}function label(s){return s==='me'?ME:(cur().name||'对方')}function preview(m){return m.type==='image'?(m.caption||'图片'):(m.text||'')}function addMin(t,n){let p=(t||now()).split(':').map(Number),x=(p[0]*60+p[1]+n)%1440;return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}function advance(){G('timeInput').value=addMin(G('timeInput').value,Math.floor(Math.random()*4))}function showReply(){if(!reply){G('replyDraft').classList.remove('show');return}G('replyTitle').textContent='回复 '+reply.label;G('replyPreview').textContent=reply.preview;G('replyDraft').classList.add('show')}function renderUsers(){let root=G('userList');root.innerHTML='';users.forEach(x=>{let b=document.createElement('button');b.className='user'+(x.id===currentUserId?' active':'');b.textContent=x.name;b.onclick=()=>{currentUserId=x.id;save();render();closeSheet()};root.appendChild(b)})}function render(){let x=cur();G('name').textContent=x.name;G('status').textContent=x.status;G('nameInput').value=x.name;G('statusInput').value=x.status;G('avatar').innerHTML=x.avatar?'<img src="'+x.avatar+'">':(x.name||'?').charAt(0);let root=G('messages');root.innerHTML='';x.messages.forEach((m,i)=>{let d=document.createElement('div');d.className='msg '+m.sender+(m.type==='image'?' media':'');if(m.reply){let q=document.createElement('div');q.className='replyBox';let qn=document.createElement('div'),qt=document.createElement('div');qn.className='replyName';qt.className='replyText';qn.textContent=m.reply.label;qt.textContent=m.reply.preview;q.append(qn,qt);d.appendChild(q)}if(m.type==='image'){let im=document.createElement('img');im.src=m.dataUrl;d.appendChild(im);if(m.caption){let c=document.createElement('div');c.className='caption';c.textContent=m.caption;d.appendChild(c)}}else{let s=document.createElement('span');s.textContent=m.text;d.appendChild(s)}let mt=document.createElement('span');mt.className='meta';mt.appendChild(document.createTextNode(m.time||now()));if(m.sender==='me'){let ck=document.createElement('span');ck.className='checks';ck.textContent=' '+(m.readState||'✓✓');mt.appendChild(ck)}d.appendChild(mt);d.onclick=()=>{reply={label:label(m.sender),preview:preview(m)};showReply()};d.addEventListener('touchstart',()=>{longTimer=setTimeout(()=>{if(confirm('删除这条模拟消息？')){x.messages.splice(i,1);reply=null;save();render();showReply()}},650)},{passive:true});['touchend','touchmove','touchcancel'].forEach(ev=>d.addEventListener(ev,()=>clearTimeout(longTimer),{passive:true}));root.appendChild(d)});root.scrollTop=root.scrollHeight;renderUsers();G('senderState').textContent='当前：'+(sender==='me'?'我发送':'对方发送')}function build(type,extra){return Object.assign({type:type,sender:sender,time:G('timeInput').value||now(),readState:G('readInput').value,reply:reply?{label:reply.label,preview:reply.preview}:null},extra)}function sendText(){let text=G('messageInput').value.trim();if(!text){sender=sender==='me'?'them':'me';render();return}cur().messages.push(build('text',{text:text}));G('messageInput').value='';reply=null;advance();save();render();showReply()}function sendImage(data){cur().messages.push(build('image',{dataUrl:data,caption:''}));reply=null;advance();save();render();showReply()}function openSheet(){G('sheet').classList.add('show');G('backdrop').classList.add('show')}function closeSheet(){G('sheet').classList.remove('show');G('backdrop').classList.remove('show')}G('settingsBtn').onclick=openSheet;G('backdrop').onclick=closeSheet;G('sendBtn').onclick=sendText;G('messageInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();sendText()}};G('closeReply').onclick=()=>{reply=null;showReply()};G('switchSender').onclick=()=>{sender=sender==='me'?'them':'me';render()};G('clipBtn').onclick=()=>G('imageInput').click();G('imageInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>sendImage(r.result);r.readAsDataURL(f);e.target.value=''};G('avatarInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{pendingAvatar=r.result};r.readAsDataURL(f)};G('saveUser').onclick=()=>{let x=cur();x.name=G('nameInput').value.trim()||'未命名';x.status=G('statusInput').value.trim()||'最近在线';if(pendingAvatar)x.avatar=pendingAvatar;pendingAvatar='';save();render()};G('addUser').onclick=()=>{let id=Math.max(0,...users.map(x=>Number(x.id)||0))+1;users.push({id:id,name:'新聊天用户',status:'最近在线',avatar:'',messages:[]});currentUserId=id;save();render()};G('deleteUser').onclick=()=>{if(users.length<=1){alert('至少保留一个聊天用户');return}if(!confirm('删除当前聊天用户及其聊天记录？'))return;users=users.filter(x=>x.id!==currentUserId);currentUserId=users[0].id;save();render()};G('clearChat').onclick=()=>{if(confirm('清空当前聊天记录？')){cur().messages=[];reply=null;save();render();showReply()}};render();</script></body></html>
