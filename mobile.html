<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Telegram Chat Mockup Mobile</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",Arial,sans-serif;background:#d8d8d8}.app{height:100dvh;width:100%;max-width:520px;margin:auto;display:flex;flex-direction:column;position:relative;overflow:hidden;background:#d8d8d8}.app:before{content:"";position:absolute;inset:0;background:url('assets/chat-bg.png') center/cover no-repeat}.header{position:relative;z-index:3;min-height:64px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;background:rgba(223,243,242,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(0,0,0,.04)}.back{font-size:32px;width:26px;color:#23292d}.avatar{width:40px;height:40px;border-radius:50%;overflow:hidden;background:#79aee8;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.info{flex:1;min-width:0;margin-left:10px}.name{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:12px;color:#687c86;margin-top:2px}.actions{font-size:20px;color:#4e6674;display:flex;gap:14px}.mock{position:absolute;z-index:7;right:10px;top:calc(72px + env(safe-area-inset-top));font-size:9px;color:#526f7b;background:rgba(255,255,255,.78);padding:3px 7px;border-radius:10px}.messages{position:relative;z-index:1;flex:1;overflow:auto;padding:14px 10px 8px;display:flex;flex-direction:column;gap:6px;scrollbar-width:none;-ms-overflow-style:none}.messages::-webkit-scrollbar{display:none}.msg{max-width:84%;min-width:58px;padding:7px 10px 6px;border-radius:17px;font-size:16px;line-height:1.3;box-shadow:0 1px 1px #0001;white-space:pre-wrap;word-break:break-word;user-select:none;-webkit-user-select:none}.them{align-self:flex-start;background:#fff;border-bottom-left-radius:5px}.me{align-self:flex-end;background:#eefcf7;border-bottom-right-radius:5px}.replyBox{border-left:3px solid #53a7ea;background:rgba(83,167,234,.10);padding:5px 7px;border-radius:8px;margin-bottom:5px}.replyName{font-weight:700;color:#3786c5;font-size:12px}.replyText{color:#4d5e68;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:#7a8a90;margin-left:7px;white-space:nowrap;float:right;margin-top:7px}.checks{color:#3d9ac4;font-weight:600}.msg.media{padding:5px}.msg.media img{display:block;max-width:72vw;max-height:42vh;border-radius:12px}.caption{padding:6px 5px 2px}.composerOuter{position:relative;z-index:3;padding:0 8px calc(8px + env(safe-area-inset-bottom))}.replyDraft{display:none;align-items:center;background:rgba(248,252,252,.97);padding:8px 11px;border-radius:16px 16px 8px 8px;margin-bottom:3px}.replyDraft.show{display:flex}.replyContent{flex:1;min-width:0}.replyTitle{font-size:12px;color:#3786c5;font-weight:700}.replyPreview{font-size:12px;color:#5b6d77;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.close{border:0;background:transparent;font-size:20px}.composerRow{display:flex;align-items:flex-end;gap:7px}.composer{flex:1;min-height:44px;background:rgba(248,252,252,.97);border-radius:23px;padding:8px 11px;display:flex;align-items:center;gap:7px}.composer input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px}.icon{border:0;background:transparent;font-size:20px;padding:0}.send{width:44px;height:44px;border-radius:50%;border:0;background:#3390ec;color:#fff;font-size:19px}.settingsBtn{position:absolute;z-index:8;right:12px;bottom:calc(70px + env(safe-area-inset-bottom));width:42px;height:42px;border:0;border-radius:50%;background:rgba(51,144,236,.92);color:#fff;font-size:20px;box-shadow:0 2px 8px #0003}.sheetBackdrop{display:none;position:absolute;z-index:19;inset:0;background:rgba(0,0,0,.25)}.sheetBackdrop.show{display:block}.sheet{position:absolute;z-index:20;left:0;right:0;bottom:0;max-height:82dvh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:.22s ease;box-shadow:0 -5px 25px #0002}.sheet.show{transform:translateY(0)}.handle{width:42px;height:5px;border-radius:5px;background:#d3d7da;margin:0 auto 12px}.sheet h2{font-size:18px;margin:0 0 12px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:#65727b;margin-bottom:5px}.field input,.field select,.field button{width:100%;padding:11px;border:1px solid #d4dce1;border-radius:10px;background:#fff;font-size:16px}.row{display:flex;gap:8px}.row>*{flex:1}.userList{display:flex;gap:7px;overflow:auto;padding:3px 0 7px;scrollbar-width:none}.userChip{flex:0 0 auto;max-width:145px;border:1px solid #dce4ea;border-radius:12px;padding:7px 9px;background:#f8fafc;font-size:13px}.userChip.active{border-color:#3390ec;background:#edf6ff}.userChip .del{margin-left:7px;color:#b14343}.primary{background:#3390ec!important;color:#fff!important;border-color:#3390ec!important}.danger{color:#a43d3d!important;background:#fff5f5!important}.senderState{text-align:center;font-size:12px;color:#60727d;margin:5px 0}.hint{font-size:11px;color:#718089;line-height:1.5;margin-top:10px}@media(min-width:700px){body{background:#cfd9df}.app{margin:0 auto}}</style></head><body><main class="app"><div class="mock">MOCKUP · 模拟聊天</div><header class="header"><div class="back">‹</div><div class="avatar" id="avatar"></div><div class="info"><div class="name" id="name"></div><div class="status" id="status"></div></div><div class="actions"><span>⌕</span><span>⋮</span></div></header><section class="messages" id="messages"></section><div class="composerOuter"><div class="replyDraft" id="replyDraft"><div class="replyContent"><div class="replyTitle" id="replyTitle"></div><div class="replyPreview" id="replyPreview"></div></div><button class="close" id="closeReply">×</button></div><div class="composerRow"><div class="composer"><button class="icon" id="clipBtn">📎</button><input id="messageInput" placeholder="输入信息" autocomplete="off"><button class="icon">😊</button></div><button class="send" id="sendBtn">➤</button></div></div><button class="settingsBtn" id="settingsBtn">⚙</button><div class="sheetBackdrop" id="backdrop"></div><section class="sheet" id="sheet"><div class="handle"></div><h2>手机设置 · V6.5</h2><div class="userList" id="userList"></div><div class="row"><div class="field"><button id="addUser" class="primary">添加用户</button></div><div class="field"><button id="deleteUser" class="danger">删除当前用户</button></div></div><div class="field"><label>昵称</label><input id="nameInput"></div><div class="field"><label>状态</label><input id="statusInput"></div><div class="field"><label>头像</label><input id="avatarInput" type="file" accept="image/*"></div><div class="field"><button id="saveUser" class="primary">保存当前用户</button></div><div class="row"><div class="field"><label>聊天当前时间</label><input id="timeInput" type="time"></div><div class="field"><label>我的消息状态</label><select id="readInput"><option value="✓✓">✓✓ 已读</option><option value="✓">✓ 已发送</option></select></div></div><div class="senderState" id="senderState">当前：对方发送</div><div class="row"><div class="field"><button id="switchSender">切换发送方</button></div><div class="field"><button id="clearChat" class="danger">清空聊天</button></div></div><div class="hint">手机操作：输入框为空时点发送键可切换发送方；单击消息引用；长按消息可删除。时间会按 0–3 分钟自然递增。数据保存在本机浏览器。MOCKUP 标识始终保留。</div></section><input id="imageInput" type="file" accept="image/*" hidden></main><script>const KEY='tgMockupV62',ME='星巴克搭建',$=id=>document.getElementById(id),now=()=>new Date().toTimeString().slice(0,5);let saved;try{saved=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}let users=saved?.users?.length?saved.users:[{id:1,name:'聊天用户',status:'最近在线',avatar:'',messages:[]}],currentUserId=users.some(u=>u.id===saved?.currentUserId)?saved.currentUserId:users[0].id,sender='them',reply=null,longTimer=null,pendingAvatar='';$('timeInput').value=now();const u=()=>users.find(x=>x.id===currentUserId)||users[0];function persist(){localStorage.setItem(KEY,JSON.stringify({users,currentUserId}))}function preview(m){return m.type==='image'?(m.caption||'图片'):(m.text||'')}function displayName(s){return s==='me'?ME:(u().name||'对方')}function addMin(t,n){let[a,b]=(t||now()).split(':').map(Number),x=(a*60+b+n)%1440;return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}function advance(){ $('timeInput').value=addMin($('timeInput').value,Math.floor(Math.random()*4))}function render(){let x=u();$('name').textContent=x.name;$('status').textContent=x.status;$('nameInput').value=x.name;$('statusInput').value=x.status;$('avatar').innerHTML=x.avatar?'<img src="'+x.avatar+'">':(x.name||'?')[0];let r=$('messages');r.innerHTML='';x.messages.forEach((m,i)=>{let d=document.createElement('div');d.className='msg '+m.sender+(m.type==='image'?' media':'');if(m.reply){let q=document.createElement('div');q.className='replyBox';q.innerHTML='<div class="replyName"></div><div class="replyText"></div>';q.children[0].textContent=m.reply.label;q.children[1].textContent=m.reply.preview;d.append(q)}if(m.type==='image'){let im=document.createElement('img');im.src=m.dataUrl;d.append(im);if(m.caption){let c=document.createElement('div');c.className='caption';c.textContent=m.caption;d.append(c)}}else{let s=document.createElement('span');s.textContent=m.text;d.append(s)}let meta=document.createElement('span');meta.className='meta';meta.textContent=m.time||now();if(m.sender==='me'){let c=document.createElement('span');c.className='checks';c.textContent=' '+(m.readState||'✓✓');meta.append(c)}d.append(meta);d.onclick=()=>{reply={label:displayName(m.sender),preview:preview(m)};showReply()};d.addEventListener('touchstart',()=>{longTimer=setTimeout(()=>{if(confirm('删除这条模拟消息？')){x.messages.splice(i,1);reply=null;persist();render();showReply()}},650)},{passive:true});['touchend','touchmove','touchcancel'].forEach(ev=>d.addEventListener(ev,()=>clearTimeout(longTimer),{passive:true}));r.append(d)});r.scrollTop=r.scrollHeight;renderUsers();$('senderState').textContent='当前：'+(sender==='me'?'我发送':'对方发送')}function renderUsers(){let r=$('userList');r.innerHTML='';users.forEach(x=>{let b=document.createElement('button');b.className='userChip'+(x.id===currentUserId?' active':'');b.textContent=x.name;b.onclick=()=>{currentUserId=x.id;persist();render();closeSheet()};r.append(b)})}function showReply(){if(!reply){$('replyDraft').classList.remove('show');return}$('replyTitle').textContent='回复 '+reply.label;$('replyPreview').textContent=reply.preview;$('replyDraft').classList.add('show')}function build(type,extra){return Object.assign({type,sender,time:$('timeInput').value||now(),readState:$('readInput').value,reply:reply?{...reply}:null},extra)}function send(){let text=$('messageInput').value.trim();if(!text){sender=sender==='me'?'them':'me';render();return}u().messages.push(build('text',{text}));$('messageInput').value='';reply=null;advance();persist();render();showReply()}function sendImage(dataUrl){u().messages.push(build('image',{dataUrl,caption:''}));reply=null;advance();persist();render();showReply()}function openSheet(){$('sheet').classList.add('show');$('backdrop').classList.add('show')}function closeSheet(){$('sheet').classList.remove('show');$('backdrop').classList.remove('show')}$('settingsBtn').onclick=openSheet;$('backdrop').onclick=closeSheet;$('sendBtn').onclick=send;$('messageInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();send()}});$('closeReply').onclick=()=>{reply=null;showReply()};$('switchSender').onclick=()=>{sender=sender==='me'?'them':'me';render()};$('clipBtn').onclick=()=>$('imageInput').click();$('imageInput').onchange=e=>{let f=e.target.files[0];if(!f)return,r=new FileReader();r.onload=()=>sendImage(r.result);r.readAsDataURL(f);e.target.value=''};$('avatarInput').onchange=e=>{let f=e.target.files[0];if(!f)return,r=new FileReader();r.onload=()=>pendingAvatar=r.result;r.readAsDataURL(f)};$('saveUser').onclick=()=>{let x=u();x.name=$('nameInput').value.trim()||'未命名';x.status=$('statusInput').value.trim()||'最近在线';if(pendingAvatar)x.avatar=pendingAvatar;pendingAvatar='';persist();render()};$('addUser').onclick=()=>{let id=Math.max(0,...users.map(x=>Number(x.id)||0))+1;users.push({id,name:'新聊天用户',status:'最近在线',avatar:'',messages:[]});currentUserId=id;persist();render()};$('deleteUser').onclick=()=>{if(users.length<2)return alert('至少保留一个聊天用户');if(!confirm('删除当前聊天用户及其聊天记录？'))return;users=users.filter(x=>x.id!==currentUserId);currentUserId=users[0].id;persist();render()};$('clearChat').onclick=()=>{if(confirm('清空当前聊天记录？')){u().messages=[];reply=null;persist();render();showReply()}};render();</script></body></html>
