<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telegram Chat Mockup V6.1</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;background:#cfd9df;color:#111}.app{height:100vh;display:flex}.panel{width:340px;background:#fff;padding:16px 16px 22px;overflow:auto;border-right:1px solid #ccd4d9}.panel h2{margin:0 0 14px;font-size:18px}.panel h3{margin:16px 0 8px;font-size:14px;color:#40515c}.field{margin:10px 0}.field label{display:block;font-size:12px;color:#65727b;margin-bottom:5px}.field input,.field select,.field button{width:100%;padding:10px;border:1px solid #cfd7dc;border-radius:10px;font-size:14px;background:#fff}.row{display:flex;gap:8px}.row>*{flex:1}.switch{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#edf2f5;padding:4px;border-radius:12px}.switch button{border:0;padding:10px;border-radius:8px;background:transparent;cursor:pointer;font-weight:700}.switch .active{background:#3390ec;color:#fff}.actionBtn{cursor:pointer;background:#f7fafc}.primary{background:#3390ec!important;color:#fff;border-color:#3390ec!important}.danger{background:#fff5f5!important;color:#a43d3d}.hint{font-size:12px;color:#718089;line-height:1.55;margin-top:12px}.userList{display:flex;flex-direction:column;gap:8px;margin-top:8px}.userItem{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid #dce4ea;border-radius:12px;cursor:pointer;background:#f9fbfd}.userItem.active{border-color:#3390ec;background:#edf6ff}.userMiniAvatar{width:36px;height:36px;border-radius:50%;background:#7aa8ee;display:grid;place-items:center;color:#fff;font-weight:700;overflow:hidden;flex:0 0 36px}.userMiniAvatar img{width:100%;height:100%;object-fit:cover}.userMeta{min-width:0;flex:1}.userMeta strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.userMeta span{display:block;font-size:12px;color:#6b7b86;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.deleteUserBtn{border:0;background:#fff0f0;color:#b14343;border-radius:8px;padding:6px 8px;cursor:pointer;font-size:12px;flex:0 0 auto}.deleteUserBtn:hover{background:#ffe1e1}.phoneWrap{flex:1;display:flex;justify-content:center;align-items:stretch}.phone{flex:1;max-width:620px;height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:#d8d8d8}.phone:before{content:"";position:absolute;inset:0;background:url('assets/chat-bg.png') center/cover no-repeat;opacity:1}.phone:after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.03);pointer-events:none}.mock{position:absolute;z-index:9;right:12px;top:76px;font-size:10px;color:#526f7b;background:rgba(255,255,255,.72);padding:3px 7px;border-radius:10px}.header{height:64px;display:flex;align-items:center;padding:8px 12px;background:rgba(223,243,242,.86);backdrop-filter:blur(16px);z-index:3;position:relative;border-bottom:1px solid rgba(0,0,0,.04)}.back{font-size:30px;line-height:1;margin-right:8px;font-weight:300;color:#23292d;width:26px;text-align:center}.topAvatar{width:40px;height:40px;border-radius:50%;overflow:hidden;background:#79aee8;display:grid;place-items:center;color:#fff;font-weight:700;border:1px solid rgba(255,255,255,.95);flex:0 0 40px}.topAvatar img{width:100%;height:100%;object-fit:cover}.topInfo{flex:1;min-width:0;margin-left:10px}.name{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}.status{font-size:12px;color:#687c86;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.topActions{display:flex;align-items:center;gap:12px;margin-left:8px;color:#4e6674;font-size:18px;opacity:.88}.messages{position:relative;z-index:1;flex:1;overflow:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:6px}.msg{position:relative;max-width:82%;min-width:62px;padding:7px 10px 6px;border-radius:17px;font-size:17px;line-height:1.28;box-shadow:0 1px 1px #0001;white-space:pre-wrap;word-break:break-word;cursor:pointer}.them{align-self:flex-start;background:#fff;border-bottom-left-radius:5px}.me{align-self:flex-end;background:#eefcf7;border-bottom-right-radius:5px}.msg.media{padding:6px}.msg.media img{display:block;max-width:280px;max-height:340px;border-radius:12px}.msg.media .caption{padding:7px 5px 2px;font-size:16px}.replyBox{border-left:3px solid #53a7ea;background:rgba(83,167,234,.10);padding:6px 8px;border-radius:9px;margin:0 0 6px;font-size:13px;line-height:1.25}.replyName{font-weight:700;color:#3786c5;font-size:12px;margin-bottom:2px}.replyText{color:#4d5e68;font-size:12px}.meta{font-size:11px;color:#7a8a90;margin-left:7px;white-space:nowrap;float:right;margin-top:7px}.checks{color:#3d9ac4;font-weight:600}.senderControls{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);z-index:8;display:flex;gap:6px}.senderControls button{border:0;border-radius:999px;padding:6px 12px;font-size:12px;background:rgba(0,0,0,.44);color:#fff;cursor:pointer}.senderControls button.active{background:#3390ec}.composerOuter{z-index:3;padding:0 10px 12px;position:relative}.replyDraft{display:none;align-items:center;gap:8px;background:rgba(248,252,252,.96);border-radius:18px 18px 10px 10px;padding:9px 12px 7px;margin-bottom:4px;box-shadow:0 1px 2px rgba(0,0,0,.06)}.replyDraft.show{display:flex}.replyDraftContent{flex:1;min-width:0}.replyDraftTitle{font-size:12px;color:#3786c5;font-weight:700}.replyDraftText{font-size:12px;color:#5b6d77;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.closeReply{border:0;background:transparent;font-size:18px;cursor:pointer;color:#667;width:auto;padding:0}.composerWrap{display:flex;align-items:flex-end;gap:8px}.composerShell{flex:1;display:flex;align-items:flex-end;gap:8px;background:rgba(248,252,252,.97);border-radius:24px;padding:8px 12px;box-shadow:0 1px 2px rgba(0,0,0,.08)}.innerAction{border:0;background:transparent;color:#7c8d96;cursor:pointer;font-size:20px;padding:0 2px;line-height:1;width:auto}.composer{flex:1;min-height:28px;display:flex;align-items:center}.composer input{border:0;outline:0;background:transparent;flex:1;font-size:16px;min-width:0;color:#182026}.send{width:44px;height:44px;border-radius:50%;border:0;background:#3390ec;color:#fff;font-size:19px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.15)}.editingBanner{display:none;align-items:center;justify-content:space-between;gap:8px;background:#fff3cd;color:#7b5d00;font-size:12px;border-radius:10px;padding:8px 10px;margin-top:8px}.editingBanner.show{display:flex}.editingBanner button{width:auto;border:0;background:transparent;color:#7b5d00;font-weight:700;cursor:pointer;padding:0}@media(max-width:900px){.panel{width:280px}.phone{max-width:none}.msg{font-size:15px}.msg.media img{max-width:220px}}</style></head><body><div class="app"><aside class="panel"><h2>聊天设置 · V6.1</h2><div class="field"><label>当前聊天用户昵称</label><input id="nameInput" value="吼吼哈嘿"></div><div class="field"><label>状态</label><input id="statusInput" value="最近上线于 20 分钟前"></div><div class="field"><label>当前聊天用户头像</label><input id="avatarInput" type="file" accept="image/*"></div><div class="row"><div class="field"><button class="actionBtn primary" id="saveUserBtn">更新当前用户</button></div><div class="field"><button class="actionBtn" id="addUserBtn">添加新聊天用户</button></div></div><h3>聊天用户列表</h3><div class="userList" id="userList"></div><h3>发送设置</h3><div class="field"><label>发送身份</label><div class="switch"><button id="themBtn" class="active">← 对方发送</button><button id="meBtn">我发送 →</button></div></div><div class="row"><div class="field"><label>消息时间</label><input id="timeInput" type="time"></div><div class="field"><label>我的消息状态</label><select id="readInput"><option value="✓✓">✓✓ 已读</option><option value="✓">✓ 已发送</option></select></div></div><div class="field"><label>图片消息可选说明</label><input id="imageCaptionInput" placeholder="例如：这是测试图（可不填）"></div><div class="row"><div class="field"><button class="actionBtn" id="sendImageBtn">发送图片消息</button></div><div class="field"><button class="actionBtn danger" id="clearBtn">清空聊天</button></div></div><input id="imageInput" type="file" accept="image/*" style="display:none"><div class="editingBanner" id="editingBanner"><span id="editingText">正在编辑消息</span><button id="cancelEditBtn">取消编辑</button></div><div class="hint">V6.1：聊天用户列表右侧新增“删除”按钮；删除前会二次确认，同时至少保留一个聊天用户。</div></aside><main class="phoneWrap"><section class="phone"><div class="mock">MOCKUP · 模拟聊天</div><header class="header"><div class="back">‹</div><div class="topAvatar" id="avatar"><span id="initial">吼</span></div><div class="topInfo"><div class="name" id="name">吼吼哈嘿</div><div class="status" id="status">最近上线于 20 分钟前</div></div><div class="topActions"><span>⌕</span><span>⋮</span></div></header><section class="messages" id="messages"></section><div class="senderControls"><button id="phoneThemBtn" class="active">对方发送</button><button id="phoneMeBtn">我发送</button></div><div class="composerOuter"><div class="replyDraft" id="replyDraft"><div class="replyDraftContent"><div class="replyDraftTitle" id="replyDraftTitle">回复</div><div class="replyDraftText" id="replyDraftText"></div></div><button class="closeReply" id="closeReplyBtn">×</button></div><footer class="composerWrap"><div class="composerShell"><button class="innerAction" id="clipBtn">📎</button><div class="composer"><input id="messageInput" placeholder="消息" autocomplete="off"></div><button class="innerAction" id="emojiBtn">😊</button></div><button class="send" id="sendBtn">➤</button></footer></div></section></main></div><script>let sender='them',userIdSeed=2,currentUserId=1,pendingAvatarData='',replyDraft=null,editingIndex=null;const randomNames=['林泽宇','陈一鸣','苏晚晴','许知远','周可可','沈星河','温言','陆景川','顾南风','乔安','李沐橙','宋知意','韩宇','周星野','简宁','白洛','程子墨','许安然','阿哲','阿凯','小宇','小白','小陈','小林','Luna','Mia','Ethan','Ryan','Noah','Ava'];const users=[{id:1,name:'吼吼哈嘿',status:'最近上线于 20 分钟前',avatar:'',messages:[]}];const $=id=>document.getElementById(id),now=()=>new Date().toTimeString().slice(0,5);$('timeInput').value=now();function escapeHtml(s=''){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}function currentUser(){return users.find(u=>u.id===currentUserId)||users[0]}function getDisplayName(side){return side==='me'?'我':(currentUser().name||'对方')}function randomUserName(){const b=randomNames[Math.floor(Math.random()*randomNames.length)],s=Math.floor(Math.random()*90)+10;return users.some(u=>u.name===b)?b+s:b}function messagePreview(m){if(!m)return'';if(m.type==='image')return m.caption?'图片 · '+m.caption:'图片';return m.text||''}function showReplyDraft(){const b=$('replyDraft');if(!replyDraft){b.classList.remove('show');return}$('replyDraftTitle').textContent='回复 '+replyDraft.label;$('replyDraftText').textContent=replyDraft.preview;b.classList.add('show')}function clearReplyDraft(){replyDraft=null;showReplyDraft()}function showEditingBanner(){const b=$('editingBanner');if(editingIndex===null){b.classList.remove('show');return}const m=currentUser().messages[editingIndex];$('editingText').textContent='正在编辑：'+(m?messagePreview(m):'消息');b.classList.add('show')}function resetDraftStates(){replyDraft=null;editingIndex=null;showReplyDraft();showEditingBanner();$('messageInput').value='';$('imageCaptionInput').value=''}function renderMessages(){const root=$('messages');root.innerHTML='';(currentUser().messages||[]).forEach((msg,index)=>{const d=document.createElement('div');d.className='msg '+msg.sender+(msg.type==='image'?' media':'');if(msg.reply){const rb=document.createElement('div'),rn=document.createElement('div'),rt=document.createElement('div');rb.className='replyBox';rn.className='replyName';rt.className='replyText';rn.textContent=msg.reply.label||getDisplayName(msg.reply.sender);rt.textContent=msg.reply.preview;rb.append(rn,rt);d.appendChild(rb)}if(msg.type==='image'){const img=document.createElement('img');img.src=msg.dataUrl;d.appendChild(img);if(msg.caption){const c=document.createElement('div');c.className='caption';c.textContent=msg.caption;d.appendChild(c)}}else{const t=document.createElement('span');t.textContent=msg.text;d.appendChild(t)}const m=document.createElement('span');m.className='meta';m.append(document.createTextNode(msg.time||now()));if(msg.sender==='me'){const c=document.createElement('span');c.className='checks';c.textContent=' '+(msg.readState||'✓✓');m.appendChild(c)}d.appendChild(m);d.title='单击引用回复｜右键编辑｜Shift+双击删除';d.onclick=()=>{replyDraft={sender:msg.sender,label:getDisplayName(msg.sender),preview:messagePreview(msg),index};showReplyDraft()};d.ondblclick=e=>{if(e.shiftKey){currentUser().messages.splice(index,1);if(editingIndex===index)editingIndex=null;if(replyDraft&&replyDraft.index===index)replyDraft=null;renderMessages();showReplyDraft();showEditingBanner()}};d.oncontextmenu=e=>{e.preventDefault();editingIndex=index;const item=currentUser().messages[index];if(item.type==='image'){const v=prompt('编辑图片说明文字（可留空）',item.caption||'');if(v!==null){item.caption=v;renderMessages()}editingIndex=null;showEditingBanner();return}$('messageInput').value=item.text||'';setSender(item.sender||'them');showEditingBanner();$('messageInput').focus()};root.appendChild(d)});root.scrollTop=root.scrollHeight}function applyCurrentUser(){const u=currentUser();$('name').textContent=u.name||' ';$('status').textContent=u.status||' ';$('nameInput').value=u.name||'';$('statusInput').value=u.status||'';$('avatar').innerHTML=u.avatar?'<img src="'+u.avatar+'" alt="avatar">':'<span id="initial">'+((u.name||'?').trim().charAt(0)||'?')+'</span>';renderUserList();renderMessages();resetDraftStates()}function renderUserList(){const root=$('userList');root.innerHTML='';users.forEach(u=>{const item=document.createElement('div');item.className='userItem'+(u.id===currentUserId?' active':'');item.onclick=()=>{currentUserId=u.id;pendingAvatarData='';applyCurrentUser()};const ava=document.createElement('div');ava.className='userMiniAvatar';ava.innerHTML=u.avatar?'<img src="'+u.avatar+'" alt="avatar">':'';if(!u.avatar)ava.textContent=((u.name||'?').trim().charAt(0)||'?');const meta=document.createElement('div');meta.className='userMeta';meta.innerHTML='<strong>'+escapeHtml(u.name)+'</strong><span>'+escapeHtml(u.status)+'</span>';const del=document.createElement('button');del.className='deleteUserBtn';del.textContent='删除';del.title='删除此聊天用户';del.onclick=e=>{e.stopPropagation();deleteUser(u.id)};item.append(ava,meta,del);root.appendChild(item)})}function deleteUser(id){if(users.length<=1){alert('至少需要保留一个聊天用户。');return}const idx=users.findIndex(u=>u.id===id);if(idx<0)return;const u=users[idx];if(!confirm('确定删除聊天用户“'+u.name+'”吗？\n该用户的聊天记录也会一起删除。'))return;const wasCurrent=id===currentUserId;users.splice(idx,1);if(wasCurrent){const next=users[Math.min(idx,users.length-1)]||users[0];currentUserId=next.id;pendingAvatarData='';applyCurrentUser();setSender('them')}else renderUserList()}function setSender(v){sender=v;$('themBtn').classList.toggle('active',v==='them');$('meBtn').classList.toggle('active',v==='me');$('phoneThemBtn').classList.toggle('active',v==='them');$('phoneMeBtn').classList.toggle('active',v==='me');$('messageInput').placeholder=v==='me'?'以“我”的身份输入消息':'以“'+(currentUser().name||'对方')+'”的身份输入消息';$('messageInput').focus()}$('themBtn').onclick=()=>setSender('them');$('meBtn').onclick=()=>setSender('me');$('phoneThemBtn').onclick=()=>setSender('them');$('phoneMeBtn').onclick=()=>setSender('me');$('emojiBtn').onclick=()=>$('messageInput').focus();$('nameInput').oninput=e=>{$('name').textContent=e.target.value||' ';if(!currentUser().avatar)$('avatar').innerHTML='<span id="initial">'+((e.target.value||'?').trim().charAt(0)||'?')+'</span>'};$('statusInput').oninput=e=>$('status').textContent=e.target.value||' ';$('avatarInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{pendingAvatarData=r.result;$('avatar').innerHTML='<img src="'+r.result+'" alt="avatar">'};r.readAsDataURL(f)};$('saveUserBtn').onclick=()=>{const u=currentUser();u.name=$('nameInput').value.trim()||'未命名';u.status=$('statusInput').value.trim()||'最近在线';if(pendingAvatarData)u.avatar=pendingAvatarData;pendingAvatarData='';applyCurrentUser();alert('当前聊天用户已更新')};$('addUserBtn').onclick=()=>{const newName=randomUserName(),status='最近上线于 '+(Math.floor(Math.random()*55)+1)+' 分钟前';users.push({id:userIdSeed++,name:newName,status,avatar:pendingAvatarData||'',messages:[]});currentUserId=users[users.length-1].id;pendingAvatarData='';applyCurrentUser();setSender('them');alert('已添加新聊天用户：'+newName)};function buildMessage(type,extra={}){return Object.assign({type,sender,time:$('timeInput').value||now(),readState:$('readInput').value,reply:replyDraft?{sender:replyDraft.sender,label:replyDraft.label,preview:replyDraft.preview}:null},extra)}function sendText(){const text=$('messageInput').value.trim();if(!text)return;const list=currentUser().messages;if(editingIndex!==null){list[editingIndex].text=text;list[editingIndex].sender=sender}else list.push(buildMessage('text',{text}));$('messageInput').value='';$('timeInput').value=now();editingIndex=null;clearReplyDraft();showEditingBanner();renderMessages();$('messageInput').focus()}function sendImage(dataUrl){currentUser().messages.push(buildMessage('image',{dataUrl,caption:$('imageCaptionInput').value.trim()}));$('timeInput').value=now();clearReplyDraft();renderMessages()}$('sendBtn').onclick=sendText;$('messageInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText()}});$('clipBtn').onclick=()=>$('imageInput').click();$('sendImageBtn').onclick=()=>$('imageInput').click();$('imageInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>sendImage(r.result);r.readAsDataURL(f);e.target.value=''};$('messageInput').addEventListener('paste',e=>{const items=[...(e.clipboardData?.items||[])],imgItem=items.find(i=>i.type&&i.type.startsWith('image/'));if(!imgItem)return;e.preventDefault();const file=imgItem.getAsFile();if(!file)return;const r=new FileReader();r.onload=()=>sendImage(r.result);r.readAsDataURL(file)});$('clearBtn').onclick=()=>{if(confirm('确定清空当前聊天用户的全部模拟消息？')){currentUser().messages=[];renderMessages();resetDraftStates()}};$('closeReplyBtn').onclick=clearReplyDraft;$('cancelEditBtn').onclick=()=>{editingIndex=null;$('messageInput').value='';showEditingBanner()};applyCurrentUser();setSender('them');</script></body></html>
