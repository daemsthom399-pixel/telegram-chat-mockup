<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telegram Chat Mockup V6.4</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;background:#cfd9df;color:#111}.app{height:100vh;display:flex}.panel{width:340px;background:#fff;padding:16px 16px 22px;overflow:auto;border-right:1px solid #ccd4d9}.panel h2{margin:0 0 14px;font-size:18px}.panel h3{margin:16px 0 8px;font-size:14px;color:#40515c}.field{margin:10px 0}.field label{display:block;font-size:12px;color:#65727b;margin-bottom:5px}.field input,.field select,.field button{width:100%;padding:10px;border:1px solid #cfd7dc;border-radius:10px;font-size:14px;background:#fff}.row{display:flex;gap:8px}.row>*{flex:1}.switch{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#edf2f5;padding:4px;border-radius:12px}.switch button{border:0;padding:10px;border-radius:8px;background:transparent;cursor:pointer;font-weight:700}.switch .active{background:#3390ec;color:#fff}.actionBtn{cursor:pointer;background:#f7fafc}.primary{background:#3390ec!important;color:#fff;border-color:#3390ec!important}.danger{background:#fff5f5!important;color:#a43d3d}.hint{font-size:12px;color:#718089;line-height:1.55;margin-top:12px}.userList{display:flex;flex-direction:column;gap:8px;margin-top:8px}.userItem{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid #dce4ea;border-radius:12px;cursor:pointer;background:#f9fbfd}.userItem.active{border-color:#3390ec;background:#edf6ff}.userMiniAvatar{width:36px;height:36px;border-radius:50%;background:#7aa8ee;display:grid;place-items:center;color:#fff;font-weight:700;overflow:hidden;flex:0 0 36px}.userMiniAvatar img{width:100%;height:100%;object-fit:cover}.userMeta{min-width:0;flex:1}.userMeta strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.userMeta span{display:block;font-size:12px;color:#6b7b86;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.deleteUserBtn{border:0;background:#fff0f0;color:#b14343;border-radius:8px;padding:6px 8px;cursor:pointer;font-size:12px;flex:0 0 auto}.phoneWrap{flex:1;display:flex;justify-content:center;align-items:stretch}.phone{flex:1;max-width:620px;height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:#d8d8d8}.phone:before{content:"";position:absolute;inset:0;background:url('assets/chat-bg.png') center/cover no-repeat}.phone:after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.03);pointer-events:none}.mock{position:absolute;z-index:9;right:12px;top:76px;font-size:10px;color:#526f7b;background:rgba(255,255,255,.72);padding:3px 7px;border-radius:10px}.header{height:64px;display:flex;align-items:center;padding:8px 12px;background:rgba(223,243,242,.86);backdrop-filter:blur(16px);z-index:3;position:relative;border-bottom:1px solid rgba(0,0,0,.04)}.back{font-size:30px;line-height:1;margin-right:8px;font-weight:300;color:#23292d;width:26px;text-align:center}.topAvatar{width:40px;height:40px;border-radius:50%;overflow:hidden;background:#79aee8;display:grid;place-items:center;color:#fff;font-weight:700;flex:0 0 40px}.topAvatar img{width:100%;height:100%;object-fit:cover}.topInfo{flex:1;min-width:0;margin-left:10px}.name{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:12px;color:#687c86;margin-top:2px}.topActions{display:flex;align-items:center;gap:12px;color:#4e6674;font-size:18px}.messages{position:relative;z-index:1;flex:1;overflow:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:6px;scrollbar-width:none;-ms-overflow-style:none}.messages::-webkit-scrollbar{display:none;width:0;height:0}.msg{position:relative;max-width:82%;min-width:62px;padding:7px 10px 6px;border-radius:17px;font-size:17px;line-height:1.28;box-shadow:0 1px 1px #0001;white-space:pre-wrap;word-break:break-word;cursor:pointer}.them{align-self:flex-start;background:#fff;border-bottom-left-radius:5px}.me{align-self:flex-end;background:#eefcf7;border-bottom-right-radius:5px}.msg.media{padding:6px}.msg.media img{display:block;max-width:280px;max-height:340px;border-radius:12px}.msg.media .caption{padding:7px 5px 2px}.replyBox{border-left:3px solid #53a7ea;background:rgba(83,167,234,.10);padding:6px 8px;border-radius:9px;margin-bottom:6px}.replyName{font-weight:700;color:#3786c5;font-size:12px}.replyText{color:#4d5e68;font-size:12px}.meta{font-size:11px;color:#7a8a90;margin-left:7px;white-space:nowrap;float:right;margin-top:7px}.checks{color:#3d9ac4;font-weight:600}.senderControls{display:none!important}.composerOuter{z-index:3;padding:0 10px 12px;position:relative}.replyDraft{display:none;align-items:center;gap:8px;background:rgba(248,252,252,.96);border-radius:18px 18px 10px 10px;padding:9px 12px 7px;margin-bottom:4px}.replyDraft.show{display:flex}.replyDraftContent{flex:1;min-width:0}.replyDraftTitle{font-size:12px;color:#3786c5;font-weight:700}.replyDraftText{font-size:12px;color:#5b6d77;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.closeReply{border:0;background:transparent;font-size:18px;cursor:pointer;color:#667}.composerWrap{display:flex;align-items:flex-end;gap:8px}.composerShell{flex:1;display:flex;align-items:flex-end;gap:8px;background:rgba(248,252,252,.97);border-radius:24px;padding:8px 12px}.innerAction{border:0;background:transparent;color:#7c8d96;cursor:pointer;font-size:20px;padding:0 2px}.composer{flex:1;min-height:28px;display:flex;align-items:center}.composer input{border:0;outline:0;background:transparent;flex:1;font-size:16px;min-width:0}.send{width:44px;height:44px;border-radius:50%;border:0;background:#3390ec;color:#fff;font-size:19px;cursor:pointer}.editingBanner{display:none;background:#fff3cd;color:#7b5d00;font-size:12px;border-radius:10px;padding:8px 10px;margin-top:8px}.editingBanner.show{display:flex;justify-content:space-between}.editingBanner button{border:0;background:transparent;color:#7b5d00;font-weight:700}@media(max-width:900px){.panel{width:280px}.phone{max-width:none}}</style></head><body><div class="app"><aside class="panel"><h2>聊天设置 · V6.4</h2><div class="field"><label>当前聊天用户昵称</label><input id="nameInput"></div><div class="field"><label>状态</label><input id="statusInput"></div><div class="field"><label>当前聊天用户头像</label><input id="avatarInput" type="file" accept="image/*"></div><div class="row"><div class="field"><button class="actionBtn primary" id="saveUserBtn">更新当前用户</button></div><div class="field"><button class="actionBtn" id="addUserBtn">添加新聊天用户</button></div></div><h3>聊天用户列表</h3><div class="userList" id="userList"></div><h3>发送设置</h3><div class="field"><label>发送身份（也可按 Enter 切换）</label><div class="switch"><button id="themBtn">← 对方发送</button><button id="meBtn">我发送 →</button></div></div><div class="row"><div class="field"><label>聊天起始/当前时间</label><input id="timeInput" type="time"></div><div class="field"><label>我的消息状态</label><select id="readInput"><option value="✓✓">✓✓ 已读</option><option value="✓">✓ 已发送</option></select></div></div><div class="field"><label>图片消息可选说明</label><input id="imageCaptionInput" placeholder="例如：这是测试图（可不填）"></div><div class="row"><div class="field"><button class="actionBtn" id="sendImageBtn">发送图片消息</button></div><div class="field"><button class="actionBtn danger" id="clearBtn">清空聊天</button></div></div><input id="imageInput" type="file" accept="image/*" style="display:none"><div class="editingBanner" id="editingBanner"><span id="editingText">正在编辑消息</span><button id="cancelEditBtn">取消编辑</button></div><div class="hint">V6.4：先设置一个起始时间，之后每发送一条新消息会自动按自然聊天节奏向后增加 0–3 分钟；例如 14:08 → 14:09 → 14:11。你随时可以手动改时间重新开始。引用我方消息固定显示“星巴克搭建”。</div></aside><main class="phoneWrap"><section class="phone"><div class="mock">MOCKUP · 模拟聊天</div><header class="header"><div class="back">‹</div><div class="topAvatar" id="avatar"></div><div class="topInfo"><div class="name" id="name"></div><div class="status" id="status"></div></div><div class="topActions"><span>⌕</span><span>⋮</span></div></header><section class="messages" id="messages"></section><div class="senderControls"><button id="phoneThemBtn">对方发送</button><button id="phoneMeBtn">我发送</button></div><div class="composerOuter"><div class="replyDraft" id="replyDraft"><div class="replyDraftContent"><div class="replyDraftTitle" id="replyDraftTitle"></div><div class="replyDraftText" id="replyDraftText"></div></div><button class="closeReply" id="closeReplyBtn">×</button></div><footer class="composerWrap"><div class="composerShell"><button class="innerAction" id="clipBtn">📎</button><div class="composer"><input id="messageInput" placeholder="输入信息" autocomplete="off"></div><button class="innerAction" id="emojiBtn">😊</button></div><button class="send" id="sendBtn">➤</button></footer></div></section></main></div><script>const KEY='tgMockupV62';const $=id=>document.getElementById(id),now=()=>new Date().toTimeString().slice(0,5);const randomNames=['林泽宇','陈一鸣','苏晚晴','许知远','周可可','沈星河','温言','陆景川','顾南风','乔安','李沐橙','宋知意','韩宇','周星野','简宁','白洛','程子墨','许安然','阿哲','阿凯','小宇','小白','小陈','小林','Luna','Mia','Ethan','Ryan','Noah','Ava'];let sender='them',pendingAvatarData='',replyDraft=null,editingIndex=null;let saved;try{saved=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}let users=saved?.users?.length?saved.users:[{id:1,name:'吼吼哈嘿',status:'最近上线于 20 分钟前',avatar:'',messages:[]}];let currentUserId=users.some(u=>u.id===saved?.currentUserId)?saved.currentUserId:users[0].id;let userIdSeed=Math.max(...users.map(u=>Number(u.id)||0))+1;$('timeInput').value=now();function persist(){try{localStorage.setItem(KEY,JSON.stringify({users,currentUserId}))}catch(e){console.warn('保存失败',e)}}function currentUser(){return users.find(u=>u.id===currentUserId)||users[0]}function getDisplayName(s){return s==='me'?'星巴克搭建':(currentUser().name||'对方')}function randomUserName(){const b=randomNames[Math.floor(Math.random()*randomNames.length)];return users.some(u=>u.name===b)?b+(Math.floor(Math.random()*90)+10):b}function preview(m){return m?.type==='image'?(m.caption?'图片 · '+m.caption:'图片'):(m?.text||'')}function addMinutes(t,n){const p=(t||now()).split(':').map(Number);let x=(p[0]*60+p[1]+n)%(24*60);return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}function advanceTime(){const step=Math.floor(Math.random()*4);$('timeInput').value=addMinutes($('timeInput').value||now(),step)}function showReply(){const b=$('replyDraft');if(!replyDraft){b.classList.remove('show');return}$('replyDraftTitle').textContent='回复 '+replyDraft.label;$('replyDraftText').textContent=replyDraft.preview;b.classList.add('show')}function resetDraft(){replyDraft=null;editingIndex=null;showReply();$('editingBanner').classList.remove('show');$('messageInput').value=''}function renderMessages(){const root=$('messages');root.innerHTML='';currentUser().messages.forEach((msg,index)=>{const d=document.createElement('div');d.className='msg '+msg.sender+(msg.type==='image'?' media':'');if(msg.reply){const rb=document.createElement('div'),rn=document.createElement('div'),rt=document.createElement('div');rb.className='replyBox';rn.className='replyName';rt.className='replyText';rn.textContent=msg.reply.label;rt.textContent=msg.reply.preview;rb.append(rn,rt);d.append(rb)}if(msg.type==='image'){const im=document.createElement('img');im.src=msg.dataUrl;d.append(im);if(msg.caption){const c=document.createElement('div');c.className='caption';c.textContent=msg.caption;d.append(c)}}else{const t=document.createElement('span');t.textContent=msg.text;d.append(t)}const meta=document.createElement('span');meta.className='meta';meta.append(document.createTextNode(msg.time||now()));if(msg.sender==='me'){const c=document.createElement('span');c.className='checks';c.textContent=' '+(msg.readState||'✓✓');meta.append(c)}d.append(meta);d.title='单击引用｜右键编辑｜Shift+双击删除';d.onclick=()=>{replyDraft={sender:msg.sender,label:getDisplayName(msg.sender),preview:preview(msg),index};showReply()};d.ondblclick=e=>{if(!e.shiftKey)return;e.preventDefault();currentUser().messages.splice(index,1);editingIndex=null;replyDraft=null;persist();renderMessages();showReply()};d.oncontextmenu=e=>{e.preventDefault();editingIndex=index;if(msg.type==='image'){const v=prompt('编辑图片说明文字（可留空）',msg.caption||'');if(v!==null){msg.caption=v;persist();renderMessages()}editingIndex=null;return}$('messageInput').value=msg.text||'';$('timeInput').value=msg.time||$('timeInput').value;setSender(msg.sender);$('editingText').textContent='正在编辑：'+preview(msg);$('editingBanner').classList.add('show');$('messageInput').focus()};root.append(d)});root.scrollTop=root.scrollHeight}function renderUsers(){const root=$('userList');root.innerHTML='';users.forEach(u=>{const item=document.createElement('div');item.className='userItem'+(u.id===currentUserId?' active':'');item.onclick=()=>{currentUserId=u.id;persist();applyUser()};const av=document.createElement('div');av.className='userMiniAvatar';if(u.avatar)av.innerHTML='<img src="'+u.avatar+'">';else av.textContent=(u.name||'?').charAt(0);const meta=document.createElement('div');meta.className='userMeta';const st=document.createElement('strong');st.textContent=u.name;const sp=document.createElement('span');sp.textContent=u.status;meta.append(st,sp);const del=document.createElement('button');del.className='deleteUserBtn';del.textContent='删除';del.onclick=e=>{e.stopPropagation();deleteUser(u.id)};item.append(av,meta,del);root.append(item)})}function applyUser(){const u=currentUser();$('name').textContent=u.name;$('status').textContent=u.status;$('nameInput').value=u.name;$('statusInput').value=u.status;$('avatar').innerHTML=u.avatar?'<img src="'+u.avatar+'">':(u.name||'?').charAt(0);renderUsers();renderMessages();resetDraft();setSender(sender)}function deleteUser(id){if(users.length<=1)return alert('至少需要保留一个聊天用户。');const u=users.find(x=>x.id===id);if(!confirm('确定删除聊天用户“'+u.name+'”吗？\n该用户聊天记录也会一起删除。'))return;users=users.filter(x=>x.id!==id);if(currentUserId===id)currentUserId=users[0].id;persist();applyUser()}function setSender(v){sender=v;$('themBtn').classList.toggle('active',v==='them');$('meBtn').classList.toggle('active',v==='me');$('messageInput').placeholder='输入信息'}function toggleSender(){setSender(sender==='them'?'me':'them')}function build(type,extra){return Object.assign({type,sender,time:$('timeInput').value||now(),readState:$('readInput').value,reply:replyDraft?{sender:replyDraft.sender,label:replyDraft.label,preview:replyDraft.preview}:null},extra)}function sendText(){const text=$('messageInput').value.trim();if(!text)return;if(editingIndex!==null){const m=currentUser().messages[editingIndex];m.text=text;m.sender=sender;m.time=$('timeInput').value||m.time||now();editingIndex=null;$('editingBanner').classList.remove('show')}else{currentUser().messages.push(build('text',{text}));advanceTime()}$('messageInput').value='';replyDraft=null;showReply();persist();renderMessages();$('messageInput').focus()}function sendImage(dataUrl){currentUser().messages.push(build('image',{dataUrl,caption:$('imageCaptionInput').value.trim()}));advanceTime();replyDraft=null;persist();renderMessages();showReply()}$('themBtn').onclick=()=>setSender('them');$('meBtn').onclick=()=>setSender('me');$('saveUserBtn').onclick=()=>{const u=currentUser();u.name=$('nameInput').value.trim()||'未命名';u.status=$('statusInput').value.trim()||'最近在线';if(pendingAvatarData)u.avatar=pendingAvatarData;pendingAvatarData='';persist();applyUser()};$('addUserBtn').onclick=()=>{const name=randomUserName();users.push({id:userIdSeed++,name,status:'最近上线于 '+(Math.floor(Math.random()*55)+1)+' 分钟前',avatar:'',messages:[]});currentUserId=users[users.length-1].id;persist();applyUser()};$('avatarInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{pendingAvatarData=r.result;$('avatar').innerHTML='<img src="'+r.result+'">'};r.readAsDataURL(f)};$('sendBtn').onclick=sendText;$('messageInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if($('messageInput').value.trim())sendText();else toggleSender()}});$('clipBtn').onclick=()=>$('imageInput').click();$('sendImageBtn').onclick=()=>$('imageInput').click();$('imageInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>sendImage(r.result);r.readAsDataURL(f);e.target.value=''};$('messageInput').addEventListener('paste',e=>{const i=[...(e.clipboardData?.items||[])].find(x=>x.type?.startsWith('image/'));if(!i)return;e.preventDefault();const f=i.getAsFile(),r=new FileReader();r.onload=()=>sendImage(r.result);r.readAsDataURL(f)});$('clearBtn').onclick=()=>{if(confirm('确定清空当前聊天用户的全部模拟消息？')){currentUser().messages=[];persist();renderMessages();resetDraft()}};$('closeReplyBtn').onclick=()=>{replyDraft=null;showReply()};$('cancelEditBtn').onclick=()=>{editingIndex=null;$('messageInput').value='';$('editingBanner').classList.remove('show')};$('emojiBtn').onclick=()=>$('messageInput').focus();applyUser();setSender('them');</script></body></html>
